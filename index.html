<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="./style/style.css" />
</head>
<body>
  <div class="weather-app">
    <h1>Weather App</h1>
    <h2>Know Before You Go Today</h2>

    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city" />
      <button id="search-btn">🔍</button>
    </div>

    <div class="weather-info hidden" id="weather-info">
      <h2 id="city-name"></h2>
      <img id="weather-icon" alt="Weather Icon" />
      <p id="description"></p>
      <p><span id="temp"></span>°C</p>
      <p>Humidity: <span id="humidity"></span>%</p>
      <p>Wind: <span id="wind"></span> km/h</p>
    </div>

    <div class="error-message hidden" id="error-message">
      City not found. Try again or check if it is well spelled!
    </div>

    <button class="refreshBtn">Refresh</button>
    <h2>Stay Sky Wise</h2>
  </div>

  <script src="./script/config.js"></script>
  <script src="./script/script.js"></script>
</body>
</html>
